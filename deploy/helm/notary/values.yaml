# Default values for the Notary chart.

image:
  repository: ghcr.io/llcforge/notary
  # Defaults to .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Single replica: the alert queue and silences live on the PVC (ReadWriteOnce).
replicaCount: 1

args: ["run", "--config", "/etc/notary/notary.toml"]

# TOML configuration mounted at /etc/notary/notary.toml. Secrets must be
# referenced by environment-variable name (*_env), never inlined here.
# The metrics/health listener must bind 0.0.0.0 inside the pod.
config: |
  [vrp]
  # Point at your validator: RTR (host:port, tls://, ssh://) or a JSON export URL.
  rtr = "routinator.rpki.svc:3323"

  [api]
  listen = "0.0.0.0:8323"

  [alerts]
  dedup_window_secs = 300

  [[alerts.sink]]
  type = "stdout"
  format = "json"

# Secrets as environment variables.
# Every key of an existing Secret:
envFromSecret: ""
# Or individual keys:
secretEnv: []
#  - name: TELEGRAM_BOT_TOKEN
#    secretName: notary-secrets
#    key: telegram-bot-token

# Plain (non-secret) environment variables.
env: []

metrics:
  port: 8323

# Additional container/service ports (e.g. BGP 179/TCP, sFlow 6343/UDP).
extraPorts: []
#  - name: bgp
#    port: 179
#    protocol: TCP

service:
  type: ClusterIP
  annotations: {}

persistence:
  enabled: true
  storageClass: ""
  size: 1Gi
  accessModes: [ReadWriteOnce]
  existingClaim: ""

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    # Tools binding ports < 1024 need NET_BIND_SERVICE; raw probes need NET_RAW.
    add: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
